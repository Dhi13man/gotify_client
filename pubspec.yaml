name: gotify_client
description: A Gotify client for macOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.3.0
  provider: ^6.0.5
  shared_preferences: ^2.1.0
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.2
  flutter_local_notifications: ^22.2.0
  logging: ^1.3.0
  web_socket_channel: ^3.0.2
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.0
  mocktail: ^1.0.5
  test: ^1.24.0
  build_runner: ^2.3.3
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
